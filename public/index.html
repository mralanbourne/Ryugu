<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ryugu Setup | JAV Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Space Mono", monospace;
            background-color: #0a0a0a;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            color: #d1d5db;
        }
        .bg-layer {
            position: fixed;
            top: -20%; left: -20%; width: 140%; height: 140%;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
            z-index: -2;
            pointer-events: none;
        }
        .glass-card {
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 1);
        }
        .neon-text {
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #6366f1, 0 0 20px #6366f1, 0 0 40px #ec4899;
        }
        .input-glass {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            border-color: rgba(99, 102, 241, 0.6);
        }
        .glass-checkbox {
            appearance: none; -webkit-appearance: none;
            width: 1.25rem; height: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 0.3rem;
            cursor: pointer; position: relative;
            transition: all 0.3s ease;
        }
        .glass-checkbox:checked {
            background: #6366f1; border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .glass-checkbox:checked::after {
            content: "✓"; position: absolute; color: white;
            font-size: 0.8rem; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-family: sans-serif;
        }
        .btn-neon {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 relative border-t-2 border-indigo-500/30">
    <div class="bg-layer"></div>

    <div class="glass-card p-8 md:p-12 rounded-3xl max-w-3xl w-full relative z-10 mx-auto my-8">
        <div class="mb-10 text-center">
            <h1 class="text-5xl font-extrabold tracking-tighter mb-2 neon-text">RYUGU</h1>
            <p class="text-xs tracking-[0.3em] text-indigo-400 uppercase mt-2">The JAV Gateway</p>
            <div class="mt-4 border-t border-white/5 w-1/3 mx-auto pt-2 opacity-30"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Left Column: Access -->
            <div class="space-y-6">
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-3 pl-2">Debrid Providers</p>
                    <div class="space-y-3">
                        <input type="password" id="rdKey" placeholder="Real-Debrid API Key" class="w-full input-glass rounded-xl px-4 py-3 text-white text-sm outline-none">
                        <input type="password" id="tbKey" placeholder="Torbox API Key" class="w-full input-glass rounded-xl px-4 py-3 text-white text-sm outline-none">
                    </div>
                </div>

                <div class="pt-4 border-t border-white/5">
                    <label class="flex items-start space-x-4 cursor-pointer group px-2">
                        <input type="checkbox" id="enableP2P" class="glass-checkbox mt-1" checked>
                        <div class="flex flex-col text-left">
                            <span class="text-[12px] text-indigo-400 font-bold uppercase tracking-widest">Enable P2P</span>
                            <span class="text-[10px] text-gray-500 mt-1 leading-relaxed">Direct BitTorrent streaming. Your IP will be visible to the swarm.</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Right Column: Filters -->
            <div class="space-y-6">
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-3 pl-2">Allowed Resolutions</p>
                    <div class="flex flex-wrap gap-2 px-2">
                        <label class="cursor-pointer"><input type="checkbox" value="8K,4K,2K" class="peer hidden res-cb" checked><div class="text-[10px] text-gray-400 bg-black/40 border border-white/5 rounded-md px-2.5 py-1.5 peer-checked:bg-indigo-500/20 peer-checked:text-indigo-400 peer-checked:border-indigo-500/50 transition-colors">4K / VR</div></label>
                        <label class="cursor-pointer"><input type="checkbox" value="1080p" class="peer hidden res-cb" checked><div class="text-[10px] text-gray-400 bg-black/40 border border-white/5 rounded-md px-2.5 py-1.5 peer-checked:bg-indigo-500/20 peer-checked:text-indigo-400 peer-checked:border-indigo-500/50 transition-colors">1080p</div></label>
                        <label class="cursor-pointer"><input type="checkbox" value="720p" class="peer hidden res-cb" checked><div class="text-[10px] text-gray-400 bg-black/40 border border-white/5 rounded-md px-2.5 py-1.5 peer-checked:bg-indigo-500/20 peer-checked:text-indigo-400 peer-checked:border-indigo-500/50 transition-colors">720p</div></label>
                        <label class="cursor-pointer"><input type="checkbox" value="480p,SD" class="peer hidden res-cb" checked><div class="text-[10px] text-gray-400 bg-black/40 border border-white/5 rounded-md px-2.5 py-1.5 peer-checked:bg-indigo-500/20 peer-checked:text-indigo-400 peer-checked:border-indigo-500/50 transition-colors">SD</div></label>
                    </div>
                </div>

                <div class="pt-4 border-t border-white/5 space-y-4 px-2">
                    <label class="flex items-center space-x-4 cursor-pointer group">
                        <input type="checkbox" id="hideUncached" class="glass-checkbox">
                        <span class="text-[11px] text-gray-400 uppercase tracking-widest">Hide Uncached Streams</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="mt-12 max-w-md mx-auto">
            <button onclick="install()" class="w-full btn-neon py-4 rounded-xl font-bold text-white tracking-widest uppercase">
                Install in Stremio
            </button>
            
            <div class="pt-6 mt-6 border-t border-white/5">
                <input type="text" id="manifestUrlDisplay" readonly value="Awaiting configuration..." class="w-full input-glass rounded-lg px-4 py-2 text-gray-500 text-[10px] outline-none text-center cursor-pointer">
            </div>
        </div>
    </div>

    <script>
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), wait);
            };
        }

        function generateManifestUrl() {
            const rd = document.getElementById("rdKey").value.trim();
            const tb = document.getElementById("tbKey").value.trim();
            const enableP2P = document.getElementById("enableP2P").checked;
            const hideUncached = document.getElementById("hideUncached").checked;
            
            const resCheckboxes = document.querySelectorAll(".res-cb:checked");
            let resolutions = [];
            resCheckboxes.forEach(cb => { resolutions = resolutions.concat(cb.value.split(",")); });

            const displayBox = document.getElementById("manifestUrlDisplay");

            if (!rd && !tb && !enableP2P) {
                displayBox.value = "Enter an API key or enable P2P...";
                return null;
            }

            const rawConfig = { hideUncached, resolutions };
            if (rd) rawConfig.rdKey = rd;
            if (tb) rawConfig.tbKey = tb;
            if (enableP2P) rawConfig.enableP2P = true;

            try {
                const base64Payload = btoa(JSON.stringify(rawConfig)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
                const finalConfig = { Ryugu: base64Payload };
                const configStr = encodeURIComponent(JSON.stringify(finalConfig));
                
                let host = window.location.host;
                if (host.includes("localhost")) host = host.replace("localhost", "127.0.0.1");
                const protocol = window.location.protocol === "https:" ? "https://" : "http://";
                
                const manifestUrl = `${protocol}${host}/${configStr}/manifest.json`;
                displayBox.value = manifestUrl;
                return manifestUrl;
            } catch (e) { return null; }
        }

        const debouncedGenerate = debounce(generateManifestUrl, 150);

        document.addEventListener("DOMContentLoaded", () => {
            const inputs = ["rdKey", "tbKey", "enableP2P", "hideUncached"];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                el.addEventListener("change", debouncedGenerate);
                if (el.tagName === "INPUT" && el.type === "password") el.addEventListener("input", debouncedGenerate);
            });
            document.querySelectorAll(".res-cb").forEach(cb => cb.addEventListener("change", debouncedGenerate));
            
            document.getElementById("manifestUrlDisplay").addEventListener("click", function() {
                if (!this.value.includes("Enter")) {
                    this.select();
                    navigator.clipboard.writeText(this.value);
                }
            });
            debouncedGenerate(); // Generate initial P2P URL
        });

        function install() {
            const url = generateManifestUrl();
            if (url) window.location.href = url.replace(/^https?:\/\//i, "stremio://");
            else alert("Please provide at least one Debrid key or enable P2P.");
        }
    </script>
</body>
</html>
